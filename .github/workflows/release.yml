name: Build Desktop, Mobile & Extension Releases

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  package-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip Browser Extension
        run: cd browser-extension && zip -r ../TurboDM-Browser-Extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: TurboDM-Browser-Extension
          path: TurboDM-Browser-Extension.zip

  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Generate App Icons
        shell: bash
        run: |
          python3 -c '
          import struct, zlib
          def make_png(w, h):
              raw = b"".join(b"\x00" + b"\x25\x63\xeb\xff" * w for _ in range(h))
              def chunk(t, d): return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          open("app-icon.png", "wb").write(make_png(512, 512))
          '
          cargo tauri icon app-icon.png
      - run: cargo tauri build
      - if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: TurboDM-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
      - if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: TurboDM-Linux-Packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install NDK and Build Tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"
      - name: Set NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Generate App Icons
        run: |
          python3 -c '
          import struct, zlib
          def make_png(w, h):
              raw = b"".join(b"\x00" + b"\x25\x63\xeb\xff" * w for _ in range(h))
              def chunk(t, d): return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          open("app-icon.png", "wb").write(make_png(512, 512))
          '
          cargo tauri icon app-icon.png
      - name: Build Android APK
        run: |
          cargo tauri android init --force || true
          cargo tauri android build --apk
      - uses: actions/upload-artifact@v4
        with:
          name: TurboDM-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
